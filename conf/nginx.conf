rewrite ^$ /;
location ~ ^/$ {
  default_type text/plain;
  return 200 "This is where Continuwuity is installed.";
}

location /_matrix {
  proxy_pass http://127.0.0.1:__PORT__;
  proxy_set_header X-Real-IP  $remote_addr;
  proxy_set_header Host  $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 600;
  client_max_body_size 100M;
  # CORS headers are emitted by continuwuity itself (see its router layers);
  # do not add Access-Control-Allow-Origin here, it would be redundant and
  # could interfere with continuwuity's per-route CORS handling.
}

# OIDC discovery endpoint served by continuwuity (used by some older Matrix
# clients, e.g. older matrix-js-sdk, to find the OAuth authorization server).
location = /.well-known/openid-configuration {
  proxy_pass http://127.0.0.1:__PORT__;
  proxy_set_header X-Real-IP  $remote_addr;
  proxy_set_header Host  $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

# Continuwuity's integrated account management interface for OAuth-compatible
# clients. Public by default (matches upstream recommendation).
location /_continuwuity {
  proxy_pass http://127.0.0.1:__PORT__;
  proxy_set_header X-Real-IP  $remote_addr;
  proxy_set_header Host  $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 600;
  client_max_body_size 100M;
}
